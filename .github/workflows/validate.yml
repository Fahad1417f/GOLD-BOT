name: GOLD-BOT validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run monitor unit tests
        working-directory: v56_signal_monitor
        run: python -m unittest discover -s . -p "test_*.py" -v
