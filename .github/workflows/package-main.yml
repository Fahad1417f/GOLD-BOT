name: Package GOLD-BOT main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source package
        run: |
          mkdir -p /tmp/package
          rsync -a --exclude='.git' ./ /tmp/package/GOLD-BOT/
          cd /tmp/package
          zip -qr GOLD-BOT-main-latest.zip GOLD-BOT
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-BOT-main-latest
          path: /tmp/package/GOLD-BOT-main-latest.zip
          retention-days: 30
